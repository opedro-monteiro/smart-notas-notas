services:
  postgresql:
    image: "bitnami/postgresql:latest"
    # Use 5433 on the host if another project (e.g. smart-vidros-saas) already binds 5432.
    ports:
      - "5433:5432"
    environment:
      POSTGRESQL_USERNAME: smart
      POSTGRESQL_PASSWORD: postgres
      POSTGRESQL_DATABASE: smart-notas-db
  redis:
    image: redis:7
    container_name: smart_redis
    restart: always
    ports:
      - "6379:6379"
